<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmallApp Modular Server{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">SmallApp <span>Server</span></span>
            </a>
            <nav class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a>
                <a href="/feature1" class="nav-link {% if '/feature1' in request.path %}active{% endif %}">Feature 1</a>
                <a href="/feature2" class="nav-link {% if '/feature2' in request.path %}active{% endif %}">Feature 2</a>
                <a href="/health" class="nav-link badge-link" target="_blank">Health API</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 SmallApp Modular Python Server &bull; Engineered for Scalable Deployments (AWS EC2 / Azure DevOps)</p>
            <div class="footer-status">
                <span class="status-indicator"></span> System Operational
            </div>
        </div>
    </footer>
</body>
</html>
