apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smallapp-development
  namespace: argocd
  labels:
    environment: dev
    app.kubernetes.io/name: smallapp
spec:
  project: smallapp-project
  source:
    repoURL: "https://github.com/TheArshadShaik/SmallAppForLearning.git"
    targetRevision: main
    path: k8s/application-k8s
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: smallapp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
