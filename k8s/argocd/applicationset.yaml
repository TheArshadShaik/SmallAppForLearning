apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: smallapp-environments
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: smallapp-dev
            valuesFile: values-dev.yaml
          - env: staging
            namespace: smallapp-staging
            valuesFile: values-dev.yaml
          - env: prod
            namespace: smallapp
            valuesFile: values-prod.yaml
  template:
    metadata:
      name: 'smallapp-{{env}}'
    spec:
      project: smallapp-project
      source:
        repoURL: 'https://github.com/TheArshadShaik/SmallAppForLearning.git'
        targetRevision: main
        path: k8s/application-k8s
        helm:
          valueFiles:
            - values.yaml
            - '{{valuesFile}}'
      destination:
        server: 'https://kubernetes.default.svc'
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
