# ==============================================================
# Native Kubernetes Blue-Green Deployment (Without Argo Rollouts)
# Uses two parallel Deployments and updates the Service selector
# ==============================================================

# 1. BLUE DEPLOYMENT (Live Production)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallapp-blue
  namespace: smallapp
  labels:
    app: smallapp
    version: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smallapp
      version: blue
  template:
    metadata:
      labels:
        app: smallapp
        version: blue
    spec:
      containers:
        - name: web
          image: arshad200/smallapp:1.0.0
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
---
# 2. GREEN DEPLOYMENT (New Release / Testing)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallapp-green
  namespace: smallapp
  labels:
    app: smallapp
    version: green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smallapp
      version: green
  template:
    metadata:
      labels:
        app: smallapp
        version: green
    spec:
      containers:
        - name: web
          image: arshad200/smallapp:1.0.1
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
