apiVersion: v1
kind: Service
metadata:
  name: smallapp-preview-service
  namespace: smallapp
  labels:
    app: smallapp
    role: preview-staging
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5000
  selector:
    app: smallapp
    # Points to new release version being tested before promotion
    version: green
