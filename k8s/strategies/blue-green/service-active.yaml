apiVersion: v1
kind: Service
metadata:
  name: smallapp-production-service
  namespace: smallapp
  labels:
    app: smallapp
    role: active-production
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 5000
  selector:
    app: smallapp
    # Points to currently active production color (blue or green)
    version: blue
