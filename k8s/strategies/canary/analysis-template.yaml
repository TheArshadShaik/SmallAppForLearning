apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: success-rate-analysis
  namespace: smallapp
spec:
  args:
    - name: service-name
  metrics:
    - name: success-rate
      interval: 30s
      count: 5
      # Abort & rollback if error rate exceeds 1% (success rate < 99%)
      successCondition: result[0] >= 0.99
      failureLimit: 2
      provider:
        prometheus:
          address: http://prometheus-server.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(nginx_ingress_controller_requests{status=~"[1-3].*",exported_service="{{args.service-name}}"}[1m]))
            /
            sum(rate(nginx_ingress_controller_requests{exported_service="{{args.service-name}}"}[1m]))
