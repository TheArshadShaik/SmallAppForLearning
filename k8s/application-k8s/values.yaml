# Default values for smallapp Helm Chart

replicaCount: 3

image:
  repository: arshad200/smallapp
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# -----------------------------------------------------------------
# 0% Downtime Rolling Update Strategy
# -----------------------------------------------------------------
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "15"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: smallapp.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

startupProbe:
  enabled: true
  initialDelaySeconds: 3
  periodSeconds: 3
  failureThreshold: 10

readinessProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 2
  successThreshold: 1
  failureThreshold: 3

livenessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 10

env:
  FLASK_ENV: "production"
  PORT: "5000"
  ENABLE_FEATURE_1: "true"
  ENABLE_FEATURE_2: "true"
  LOG_LEVEL: "INFO"
  APP_TITLE: "SmallApp Production Microservices"

secrets:
  SECRET_KEY: "smallapp-production-secret-key-change-me"
  DATABASE_URL: "sqlite:////tmp/smallapp_k8s.db"

nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - smallapp
          topologyKey: kubernetes.io/hostname
