# Environment values for Production
replicaCount: 5

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 25%
    maxUnavailable: 0

autoscaling:
  enabled: true
  minReplicas: 5
  maxReplicas: 15
  targetCPUUtilizationPercentage: 65
  targetMemoryUtilizationPercentage: 75

podDisruptionBudget:
  enabled: true
  minAvailable: 3

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

ingress:
  hosts:
    - host: smallapp.production.example.com
      paths:
        - path: /
          pathType: Prefix

env:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
  ENABLE_FEATURE_1: "true"
  ENABLE_FEATURE_2: "true"
  APP_TITLE: "SmallApp Production High Availability"
