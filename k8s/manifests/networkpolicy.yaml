apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: smallapp-network-policy
  namespace: smallapp
  labels:
    app.kubernetes.io/name: smallapp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smallapp
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controllers and same namespace
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow outbound HTTPS (for external API / telemetry if needed)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
