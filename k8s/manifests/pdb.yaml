apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: smallapp-pdb
  namespace: smallapp
  labels:
    app.kubernetes.io/name: smallapp
spec:
  # Guarantees at least 2 pods remain running during node maintenance/drains
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smallapp
