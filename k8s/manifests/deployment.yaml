apiVersion: apps/v1
kind: Deployment
metadata:
  name: smallapp-deployment
  namespace: smallapp
  labels:
    app.kubernetes.io/name: smallapp
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 3
  revisionHistoryLimit: 10
  # -----------------------------------------------------------------
  # 0% Downtime Zero-Drop Rolling Update Strategy:
  # maxUnavailable: 0 ensures no existing pods are killed until
  # new pods pass their readiness checks and receive traffic.
  # maxSurge: 25% allows creating up to 25% extra pods during rollout.
  # -----------------------------------------------------------------
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: smallapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smallapp
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: smallapp
          image: arshad200/smallapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: smallapp-config
            - secretRef:
                name: smallapp-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # -----------------------------------------------------------
          # Zero Downtime Probes & Lifecycle Hook:
          # -----------------------------------------------------------
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            # Drain in-flight connections before SIGTERM is sent
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
